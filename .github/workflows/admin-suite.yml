name: Admin suite checks
on:
  pull_request:
    paths:
      - 'admin-api/**'
      - 'admin/**'
      - '.github/workflows/admin-suite.yml'
  push:
    branches: [main]
    paths:
      - 'admin-api/**'
      - 'admin/**'
      - '.github/workflows/admin-suite.yml'
jobs:
  api:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      RETAILNAV_ADMIN_DATA_DIR: /tmp/retailnav-admin-test-default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check admin-api/server.mjs
      - run: node --test admin-api/server.test.mjs
      - run: node --test backend/server.test.mjs
      - name: Verify standalone admin subfolder package
        run: |
          python3 scripts/build-admin-web.py --out /tmp/retailnav-admin-sites
          test -s /tmp/retailnav-admin-sites/map-studio/index.html
          test -s /tmp/retailnav-admin-sites/control/index.html
          test -s /tmp/retailnav-admin-sites/mall-manager/index.html
          test -s /tmp/retailnav-admin-sites/merchant/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/retailnav-admin-sites/demo')
          malls=json.loads((root/'malls.json').read_text())['items']
          assert any(x['id']=='del-parque-shopping' and len(x['floors'])==3 for x in malls)
          for mall in malls:
              assert mall['navigable'] is False
              for floor in mall['floors']:
                  source=json.loads((root/'malls'/mall['id']/(floor['id']+'.json')).read_text())
                  assert source['imageSize']==floor['imageSize']
                  assert len(source['features'])>0
          print('ADMIN_ISOLATED_BUILD_PASS',len(malls))
          PY
      - name: Check frontend embedded JS syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self): super().__init__();self.script=False;self.js=''
              def handle_starttag(self, tag, attrs):
                  if tag=='script':self.script=True
              def handle_data(self, data):
                  if self.script:self.js+=data
              def handle_endtag(self,tag):
                  if tag=='script':self.script=False
          p=P();p.feed(Path('admin/map-studio/index.html').read_text())
          Path('/tmp/map-studio.js').write_text(p.js)
          PY
          node --check /tmp/map-studio.js
