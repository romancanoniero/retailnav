name: Verify RetailNav real mobile browser
on:
  push:
    paths:
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish RetailNav to Contabo"]
    types: [completed]

permissions:
  contents: read

jobs:
  browser-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      RN_BROWSER: ${{ matrix.engine }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install temporary browser test dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Test live RetailNav on a touch-enabled mobile viewport
        run: node scripts/smoke-browser.mjs
