name: Build RetailNav 3D mock
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "tools/**"
      - "deploy/**"
      - ".github/workflows/build-retailnav.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the three floor maps match the embedded visitor data
        run: python tools/verify_maps.py
      - name: Generate and optimize the four GLB models
        run: python tools/build_glb.py
      - name: Verify glTF structure, byte lengths, and map integrity
        run: python tools/verify_maps.py --require-glb
      - name: Prepare artifact inventory
        run: |
          cd public
          sha256sum index.html maps/LL.json maps/UL.json maps/L3.json maps/manifest.json maps/Aventura-*.glb > SHA256SUMS
      - name: Upload complete static distribution
        uses: actions/upload-artifact@v4
        with:
          name: RetailNav-Aventura-Static
          path: public/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
