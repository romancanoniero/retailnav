name: Check RetailNav container locally
on:
  push:
    paths:
      - ".github/workflows/diagnose-static.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSHPASS: ${{ secrets.CONTABO_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned SSH connection
        shell: bash
        run: |
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass
          ssh-keyscan -T 10 -t ed25519 217.216.82.209 2>/dev/null > "$RUNNER_TEMP/known_hosts"
          fp=$(ssh-keygen -l -E sha256 -f "$RUNNER_TEMP/known_hosts" | awk 'NR==1 {print $2}')
          test "$fp" = "SHA256:Wz39FN6dMSMvzdjlrd2mwCwPWgEPoVlDQgYIxnbWDvo"
      - name: Run nginx in unpublished, ephemeral local test container
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -T \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no -o ConnectTimeout=15 \
            iankmp@217.216.82.209 'bash -s' < deploy/diagnose-static.sh
