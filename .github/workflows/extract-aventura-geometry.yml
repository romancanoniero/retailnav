name: Extract Aventura source GLB reference plans
on:
  push:
    branches: [research/aventura-hires]
    paths:
      - ".github/workflows/extract-aventura-geometry.yml"
      - "scripts/extract-aventura-geometry.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retailnav-aventura-glb-research
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/aventura-hires
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mesh projection dependencies
        run: python3 -m pip install -q numpy pillow trimesh opencv-python-headless
      - name: Read source geometry and render shared-coordinate reference images
        id: render
        continue-on-error: true
        run: python3 scripts/extract-aventura-geometry.py
      - name: Publish research diagnostics and high-resolution PNGs
        if: always()
        run: |
          set -e
          git config user.name "RetailNav Research"
          git config user.email "actions@users.noreply.github.com"
          git add research-output/aventura || true
          if ! git diff --cached --quiet; then
            git commit -m "Research: source GLB-derived multi-floor alignment maps"
            git pull --rebase origin research/aventura-hires
            git push origin HEAD:research/aventura-hires
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aventura-mall-glb-plans
          path: research-output/aventura/
          retention-days: 7
      - name: Assert source geometry projected
        env:
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: test "$RENDER_OUTCOME" = success
