name: Inspect Aventura RoveIQ source map structure
on:
  push:
    branches: [research/aventura-hires]
    paths:
      - "scripts/inspect-aventura-map.py"
      - ".github/workflows/inspect-aventura-map.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/aventura-hires
      - name: Inspect public geometry metadata
        run: python3 scripts/inspect-aventura-map.py
      - name: Commit metadata-only inspection
        run: |
          git config user.name "RetailNav Research"
          git config user.email "actions@users.noreply.github.com"
          git add research-output/aventura/map-json-inspection.json
          git diff --cached --quiet || {
            git commit -m "Research: mapped original floor plan and transitions schema"
            git pull --rebase origin research/aventura-hires
            git push origin HEAD:research/aventura-hires
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aventura-map-source-inspection
          path: research-output/aventura/map-json-inspection.json
