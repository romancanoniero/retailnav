name: Temporary iPhone gesture E2E branch QA
on:
  push:
    branches:
      - fix/iphone-webkit-gesture-qa-stabilization
    paths:
      - scripts/smoke-browser.mjs
      - .github/workflows/ios-gesture-branch-qa.yml

permissions:
  contents: read

jobs:
  gesture-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      RN_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run E2E against ALREADY PUBLISHED iPhone navigation
        run: node scripts/smoke-browser.mjs
