name: Verify mall logo on first loading-screen paint
on:
  push:
    branches: [fix/loader-brand-first-paint-20261015]
    paths:
      - "src/loader-brand.js"
      - "src/mall-selector.js"
      - "src/page.template.html"
      - "scripts/build-web.py"
      - "scripts/test-loader-brand-first-paint.mjs"
      - ".github/workflows/loader-first-paint.yml"
  pull_request:
    paths:
      - "src/loader-brand.js"
      - "src/mall-selector.js"
      - "src/page.template.html"
      - "scripts/build-web.py"
      - "scripts/test-loader-brand-first-paint.mjs"
      - ".github/workflows/loader-first-paint.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax, validation and original map verification
        run: |
          node --check src/loader-brand.js
          node --check src/mall-selector.js
          node --check scripts/test-loader-brand-first-paint.mjs
          python3 scripts/build-web.py
          python3 scripts/verify.py public
          node --test scripts/test-mall-themes.mjs scripts/test-map-cache.mjs
      - name: Verify loader catalog position and prevent unsafe public URLs
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          html=Path("public/index.html").read_text(encoding="utf8")
          x=re.search(r'<script id="rnLoaderBrandCatalog" type="application/json">([\s\S]*?)</script>', html)
          assert x, "missing early public brand catalog"
          small=json.loads(x.group(1))
          assert len(x.group(1))<2400, "early identity catalog became too heavy"
          assert small["aventura"]["logoSymbolUrl"]=="branding/aventura-mark.svg"
          assert small["aventura"]["font"]=="editorial"
          assert small["ap-plaza"]["logoSymbolUrl"] is None
          assert 'id="mallCatalog"' in html
          assert html.index('id="rnLoaderBrandCatalog"')<html.index('id="mallCatalog"')
          assert html.index('window.RetailNavLoaderBrand')<html.index('id="mallCatalog"')
          print("PASS fast first-paint manifest",len(x.group(1)),"bytes")
          PY
  browser:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build same HTML that Contabo will deploy
        run: python3 scripts/build-web.py
      - name: Install real Chromium and WebKit engines
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify logo truly visible before catalog/viewer parse on a slow iPhone
        env:
          RETAILNAV_TEST_WEBKIT: "1"
        run: node scripts/test-loader-brand-first-paint.mjs
      - name: Verify existing cold/warm cache, retry and logo placement regressions
        run: |
          node scripts/test-map-cache-browser.mjs
          node scripts/test-mall-logo-browser.mjs
