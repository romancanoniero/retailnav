name: Verify versioned mall map cache
on:
  push:
    branches: [feature/mall-versioned-cache]
    paths:
      - ".github/workflows/map-cache.yml"
      - "src/map-cache.js"
      - "src/page.template.html"
      - "src/style.css"
      - "src/viewer.js"
      - "scripts/build-web.py"
      - "scripts/verify.py"
      - "scripts/test-map-cache.mjs"
      - "scripts/smoke-browser.mjs"
      - "scripts/test-map-cache-browser.mjs"
      - "deploy/deploy-isolated.sh"
      - "docs/MAP-CACHE-VERSIONS.md"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/map-cache.js"
      - "src/page.template.html"
      - "src/viewer.js"
      - "scripts/build-web.py"
      - "scripts/verify.py"
      - "deploy/deploy-isolated.sh"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check src/map-cache.js
          node --check src/viewer.js
          node --check src/mall-selector.js
      - name: Verify deploy shell syntax
        run: bash -n deploy/deploy-isolated.sh
      - name: Cache version and offline unit tests
        run: node --test scripts/test-map-cache.mjs
      - name: Generate immutable mall packages from the canonical vectorized files
        run: python3 scripts/build-web.py
      - name: Validate all original polygons, naming and map cache manifest integrity
        run: python3 scripts/verify.py public
      - name: Show build artifact status
        run: |
          du -h public/index.html
          du -h public/maps/malls/*.json
  browser:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build browser data
        run: python3 scripts/build-web.py
      - name: Install isolated browser test environment
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: E2E cache, version, switching mall and white overlay
        run: node scripts/test-map-cache-browser.mjs
