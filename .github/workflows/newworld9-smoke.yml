name: New World City nine-floor browser smoke
on:
  pull_request:
    paths:
      - 'public/newworld9/**'
      - 'scripts/test-newworld9-*.mjs'
      - 'scripts/newworld9_catalog.py'
      - 'scripts/build-web.py'
      - 'scripts/verify.py'
      - 'src/viewer.js'
      - 'src/roof-text3d.js'
      - 'src/positioning-core.js'
      - 'src/cooperative-positioning.js'
      - 'src/indoor-location.js'
      - 'backend/server.mjs'
      - 'backend/server.test.mjs'
      - 'scripts/test-positioning-core.mjs'
      - 'scripts/test-positioning-web-e2e.mjs'
      - 'src/poi-layer.js'
      - 'scripts/test-newworld9-main-browser.mjs'
      - 'src/style.css'
      - 'scripts/test-map-pinch-isolated.mjs'
      - 'src/escalators3d.js'
      - 'src/service-icons3d.js'
      - 'src/vertical-shafts3d.js'
      - 'data/malls/new-world-city-shanghai/elevator-shafts.provisional.json'
      - 'data/malls/new-world-city-shanghai/escalator-fixtures.photo.json'
      - '.github/workflows/newworld9-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-newworld9-data.mjs
      - run: node scripts/test-escalator-geometry.mjs
      - run: python3 scripts/build-web.py
      - run: python3 scripts/verify.py public
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/test-newworld9-browser.mjs
      - run: node scripts/test-newworld9-main-browser.mjs
      - run: node scripts/test-positioning-core.mjs
      - run: node scripts/test-positioning-web-e2e.mjs chromium
      - run: node scripts/test-positioning-web-e2e.mjs webkit
      - run: node scripts/test-map-pinch-isolated.mjs chromium
      - run: node scripts/test-map-pinch-isolated.mjs webkit
