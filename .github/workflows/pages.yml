name: Preview RetailNav (GitHub Pages)

# GitHub Pages must be enabled by the repo owner before manually running.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: retailnav-pages
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild standalone browser demo
        run: python3 scripts/build-web.py
      - name: Validate floor vectors
        run: python3 scripts/verify.py public
      - name: Build mobile GLB models
        run: python3 scripts/build-glb.py public
      - name: Validate 3D assets
        run: python3 scripts/verify.py public
      # Pages must be enabled once by the repo owner in Settings > Pages.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/
      - id: deployment
        uses: actions/deploy-pages@v4
