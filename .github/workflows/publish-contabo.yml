name: Publish RetailNav to Contabo
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-contabo.yml"
      - "src/**"
      - "public/**"
      - "backend/**"
      - "scripts/**"
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retailnav-contabo-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify anonymous identity, QR consent and source syntax
        run: |
          node --check src/viewer.js
          node --check src/wayfinding-route.js
          node --check src/tablet-header.js
          node --check src/units.js
          node --check src/search-i18n.js
          node --check src/area-labels.js
          node --check src/districts-webgl.js
          node --check src/social.js
          node --check src/demo-friends.js
          node --check src/pins3d.js
          node --check src/jsqr.js
          node --check src/positioning-core.js
          node --check src/cooperative-positioning.js
          node --check src/indoor-location.js
          node --test scripts/test-positioning-core.mjs
          node --test scripts/test-wayfinding-route.mjs
          node --check backend/server.mjs
          node --test backend/server.test.mjs
          node --test scripts/test-demo-model.mjs
          bash -n deploy/deploy-isolated.sh
          bash -n deploy/deploy-social.sh
      - name: Build and validate floor vectors
        run: |
          python3 scripts/build-web.py
          python3 scripts/verify.py public
          node --test scripts/test-multilingual-search.mjs
  tablet-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 scripts/build-web.py
      - run: python3 scripts/test-source-map.py
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/test-store-search-browser.mjs
      - run: node scripts/test-source-map-browser.mjs
      - run: node scripts/test-source-map-comparison.mjs
      - run: BROWSER=webkit node scripts/test-source-map-comparison.mjs
      - run: BROWSER=webkit node scripts/test-source-map-browser.mjs
      - run: node scripts/test-wayfinding-browser.mjs
      - run: BROWSER=webkit node scripts/test-wayfinding-browser.mjs
      - run: node scripts/test-positioning-web-e2e.mjs chromium
      - run: node scripts/test-positioning-web-e2e.mjs webkit
  publish:
    needs: [validate, tablet-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: retailnav-production
      url: https://improvingyourreality.com/retailnav/
    env:
      SSHPASS: ${{ secrets.CONTABO_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify access configuration
        shell: bash
        run: |
          test -n "$SSHPASS" || { echo "::error::CONTABO_SSH_PASSWORD not configured"; exit 2; }
          test -f deploy/deploy-isolated.sh
          bash -n deploy/deploy-isolated.sh
      - name: Prepare SSH client
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass
      - name: Verify approved Contabo SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retailnav-ssh"
          ssh-keyscan -T 10 -t ed25519 217.216.82.209 2>/dev/null > "$RUNNER_TEMP/retailnav-ssh/known_hosts"
          fingerprint=$(ssh-keygen -l -E sha256 -f "$RUNNER_TEMP/retailnav-ssh/known_hosts" | awk 'NR==1 {print $2}')
          echo "Server SSH fingerprint: $fingerprint"
          test "$fingerprint" = "SHA256:Wz39FN6dMSMvzdjlrd2mwCwPWgEPoVlDQgYIxnbWDvo"
      - name: Start isolated persistent anonymous contacts API first
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -T \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/retailnav-ssh/known_hosts" \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=15 \
            -o NumberOfPasswordPrompts=1 \
            iankmp@217.216.82.209 \
            "bash -s -- $GITHUB_SHA" < deploy/deploy-social.sh
      - name: Install isolated RetailNav container and verify public route
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -T \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/retailnav-ssh/known_hosts" \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=15 \
            -o NumberOfPasswordPrompts=1 \
            iankmp@217.216.82.209 \
            "bash -s -- $GITHUB_SHA" < deploy/deploy-isolated.sh
      - name: Confirm independent public assets and unchanged homepage
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --connect-timeout 10 --max-time 20 -o /tmp/retailnav-index.html https://improvingyourreality.com/retailnav/
          grep -q "RetailNav" /tmp/retailnav-index.html
          grep -q 'id="peopleDialog"' /tmp/retailnav-index.html
          grep -q 'id="rnAvatarTrigger"' /tmp/retailnav-index.html
          grep -q 'id="rnShareInvite"' /tmp/retailnav-index.html
          grep -q 'id="rnFriends"' /tmp/retailnav-index.html
          grep -q 'id="rnDemoFriends"' /tmp/retailnav-index.html
          grep -q 'id="peoplePinCanvas"' /tmp/retailnav-index.html
          grep -q 'retailnav.presence' /tmp/retailnav-index.html || grep -q 'mock-ul-01' /tmp/retailnav-index.html
          curl -fL --retry 2 --connect-timeout 10 --max-time 20 -o /tmp/retailnav.glb https://improvingyourreality.com/retailnav/maps/Aventura-ALL.glb
          python3 - <<'PY'
          from pathlib import Path
          data=Path('/tmp/retailnav.glb').read_bytes()
          assert data[:4] == b'glTF' and len(data)>200000
          print('Aventura-ALL.glb validated:',len(data),'bytes')
          PY
          curl -fLsS --connect-timeout 10 --max-time 20 -o /tmp/retailnav-home.html https://improvingyourreality.com/
          grep -q "Improving Your Reality" /tmp/retailnav-home.html
          curl -fLsS --connect-timeout 10 --max-time 20 -o /tmp/retailnav-api-health.json https://improvingyourreality.com/retailnav/api/health
          python3 - <<'PY'
          import json
          response=json.load(open('/tmp/retailnav-api-health.json'))
          assert response['ok'] is True and response['service']=='retailnav-anonymous-presence'
          print('PASS: contacts API healthy and isolated.')
          PY
          # Independently verify the NEW New World City nine-floor demo route.
          curl -fLsS --retry 3 --connect-timeout 10 --max-time 25 \
            -o /tmp/newworld9-index.html https://improvingyourreality.com/retailnav/newworld9/
          grep -q 'New World City' /tmp/newworld9-index.html
          curl -fLsS --retry 3 --connect-timeout 10 --max-time 25 \
            -o /tmp/newworld9-data.js https://improvingyourreality.com/retailnav/newworld9/data.js
          grep -q '__NWC9_MODEL_B64' /tmp/newworld9-data.js
          curl -fLsS --retry 3 --connect-timeout 10 --max-time 25 \
            -o /tmp/newworld9-L9.webp https://improvingyourreality.com/retailnav/newworld9/photos/L9.webp
          python3 - <<'PY'
          from pathlib import Path
          data=Path('/tmp/newworld9-L9.webp').read_bytes()
          assert data[:4]==b'RIFF' and data[8:12]==b'WEBP' and len(data)>20000
          print('PASS: New World City L1-L9 public route, model data and reference image')
          PY

          # Validate integrated nine-floor map in PRIMARY RetailNav, not only /newworld9/.
          curl -fLsS --retry 3 --connect-timeout 10 --max-time 60 \
            -o /tmp/newworld-main-catalog.html 'https://improvingyourreality.com/retailnav/?mall=new-world-city-shanghai'
          python3 - <<'PY'
          import hashlib, json, re, subprocess
          from pathlib import Path
          html=Path('/tmp/newworld-main-catalog.html').read_text(encoding='utf-8')
          match=re.search(r'<script id="mallCatalog" type="application/json">([\s\S]+?)</script>',html)
          assert match, 'Public RetailNav missing lightweight mall catalog'
          catalog=json.loads(match.group(1))
          expected={
              'aventura': ['LL','UL','L3'],
              'ap-plaza': ['B1'],
              'new-world-city-shanghai': ['L1','L2','L3','L4','L5','L6','L7','L8','L9']
          }
          for slug,levels in expected.items():
              mall=catalog[slug]
              assert 'floors' not in mall, 'Full geometry unexpectedly embedded in HTML'
              assert mall['floorLabels']==levels
              asset=mall['mapAsset']
              assert re.fullmatch(r'maps/malls/'+re.escape(slug)+r'-[a-f0-9]{64}\.json',asset['url'])
              assert len(asset['sha256'])==64 and asset['floorCount']==len(levels)
              url='https://improvingyourreality.com/retailnav/'+asset['url']
              content=subprocess.run(
                  ['curl','-fLsS','--retry','3','--connect-timeout','10',
                   '--max-time','30',url],check=True,capture_output=True).stdout
              assert len(content)==asset['bytes']
              assert hashlib.sha256(content).hexdigest()==asset['sha256']
              bundle=json.loads(content)
              assert bundle['schema']=='retailnav.map.bundle.v1'
              assert bundle['mallId']==slug and bundle['version']==asset['version']
              assert [f[0] for f in bundle['floors']]==levels
              if slug=='new-world-city-shanghai':
                  assert sum(len(f[3]) for f in bundle['floors'])==737
                  assert mall['navigable'] is False
              print('PASS: PUBLIC versioned mall bundle',slug,len(levels),'floors',len(content),'bytes, SHA-256 OK')
          PY

          echo "PASS: RetailNav HTML, GLB 3D and original homepage verified."
