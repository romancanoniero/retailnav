name: Validate provisional AP Plaza AI2D map
on:
  push:
    branches:
      - feature/ap-plaza-ai2d-photo-wall-validation
    paths:
      - "scripts/refine_ai2d_photo_walls.py"
      - "scripts/test_ai2d_photo_walls.py"
      - "data/malls/ap-plaza/experimental/**"
      - ".github/workflows/verify-ai2d-photo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-experimental-photo-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geometry and image dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless "shapely>=2.1,<3"
      - name: Validate photo-backed splits, codes and polygon topology
        run: python -m unittest scripts/test_ai2d_photo_walls.py -v
      - name: Reject accidental navigation approval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/malls/ap-plaza/experimental/B1.ai2d.photo-refined.v2.review.json').read_text())
          assert report['geometryReviewApproved'] is False
          assert report['publishedToContabo'] is False
          print('Gate PASSED: provisional map has not been approved for navigation')
          PY
