name: Verify strong mall-name contrast on every shopping
on:
  push:
    branches: [fix/mall-name-contrast-all-centers-20261015]
    paths:
      - "src/style.css"
      - "src/mall-theme.js"
      - "scripts/test-mall-themes.mjs"
      - "scripts/test-mall-logo-browser.mjs"
      - "scripts/test-map-cache-browser.mjs"
      - "src/page.template.html"
      - ".github/workflows/verify-mall-title-contrast.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test color contrast, palette fallback and source syntax
        run: |
          node --check src/mall-theme.js
          node --check src/mall-selector.js
          node --check scripts/test-mall-logo-browser.mjs
          node --test scripts/test-mall-themes.mjs
          node --test scripts/test-map-cache.mjs
      - name: Verify unchanged vector maps and public catalog
        run: |
          python3 scripts/build-web.py
          python3 scripts/verify.py public
  browser:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile current official shopping themes
        run: python3 scripts/build-web.py
      - name: Install mobile Chromium test environment
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate computed header colors and dynamic palette on iPhone viewport
        run: node scripts/test-mall-logo-browser.mjs
      - name: Verify versioned mall cache and geometry unaffected
        run: node scripts/test-map-cache-browser.mjs
