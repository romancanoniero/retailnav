name: Verify and package RetailNav

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and privacy tests for anonymous presence
        run: |
          node --check src/viewer.js
          node --check src/social.js
          node --check src/demo-friends.js
          node --check src/pins3d.js
          node --check src/pins-webgl.js
          node --check src/poi-layer.js
          node --check src/units.js
          node --check src/unit-signs-webgl.js
          node --check src/districts-webgl.js
          node --check src/area-labels.js
          node --check src/indoor-location.js
          node --check src/positioning-core.js
          node --check src/cooperative-positioning.js
          node --test scripts/test-positioning-core.mjs
          node --check src/qrcode.min.js
          node --check backend/server.mjs
          node --test backend/server.test.mjs
          node --test scripts/test-demo-model.mjs
      - name: Validate reusable vectorizer and opt-in AI reviewer syntax
        run: |
          python3 -m py_compile scripts/floorplan_vectorizer.py scripts/refine_curved_floor.py scripts/ai_floor_review.py
      - name: Verify image-to-vector importer, true curves and offline AI safety
        run: |
          python3 -m pip install --disable-pip-version-check numpy opencv-python-headless 'shapely>=2.1'
          python3 scripts/test_vectorizer.py
          python3 scripts/test_curved_floor.py
          python3 scripts/test_ai_floor_review.py
          python3 scripts/test_ai2d_convert.py
          python3 scripts/test_newworld_photo_colours.py
      - name: Regenerate AP Plaza v2 and assert byte-for-byte identical 3D mesh
        run: |
          python3 scripts/convert_ai2d_retailnav.py \
            --input data/malls/ap-plaza/experimental/B1.ai2d.photo-refined.v2.zlib.b64 \
            --output /tmp/ap-plaza-ai2d-v2.zlib.b64 \
            --report /tmp/ap-plaza-ai2d-report.json
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          def raw(path):
              return zlib.decompress(base64.b64decode(Path(path).read_text().strip()))
          expected=raw('data/malls/ap-plaza/B1.geometry.ai2d.v2.zlib.b64')
          actual=raw('/tmp/ap-plaza-ai2d-v2.zlib.b64')
          assert actual==expected, 'Original geometry content differs from reproducible source'
          print('PASS: 197 candidates reproduce the EXACT geometry bytes (base64 whitespace ignored)')
          PY
      - name: Regenerate browser viewer from editable sources
        run: python3 scripts/build-web.py
      - name: Validate vector floor maps and browser bundle
        run: python3 scripts/verify.py public
      - name: Build optimized GLB floor models
        run: python3 scripts/build-glb.py public
      - name: Verify GLB outputs
        run: python3 scripts/verify.py public
      - name: Check shell install scripts
        run: |
          bash -n deploy/install-on-contabo.sh
          bash -n deploy/deploy-isolated.sh
      - name: Package standalone static site for Contabo
        uses: actions/upload-artifact@v4
        with:
          name: RetailNav-Aventura-static-site
          path: public/
          retention-days: 30
