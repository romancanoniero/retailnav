<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RetailNav · Administración</title><style>body{font:15px system-ui;background:#101923;color:#e8eef6;margin:0}header{padding:22px;background:#192839;display:flex;justify-content:space-between;align-items:center}main{max-width:1000px;margin:auto;padding:24px}section{background:#1c2a3a;border:1px solid #3b4d61;border-radius:8px;padding:20px;margin:18px 0}input,select,button{font:inherit;background:#263b51;color:inherit;border:1px solid #526985;padding:10px;margin:6px;border-radius:5px}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #76c7ff}label{display:block;margin:7px 0}label input{width:min(450px,95%)}.muted{color:#b0c4d8}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #334960;text-align:left;padding:9px}a{color:#81cbff}#status{padding:12px}</style></head><body><header><strong id="title">RetailNav</strong><a href="../app/">Visor de visitantes</a></header><main><section id="auth"><h2>Acceso administrativo</h2><form id="login"><label>Correo<input name="email" type="email" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><label>Código MFA<input name="totp" inputmode="numeric" pattern="[0-9]{6}" required></label><button>Ingresar</button></form></section><div id="private" class="hidden"><section><h2 id="heading"></h2><p class="muted" id="intro"></p><p id="identity"></p><button id="reload">Actualizar</button><button id="logout">Salir</button></section><section id="content"><h2>Datos autorizados</h2><table><thead><tr><th>Nombre</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="rows"></tbody></table></section><section id="createTenant" class="hidden"><h2>Crear organización</h2><form id="tenantForm"><label>Nombre<input name="name" minlength="3" required></label><button>Registrar tenant</button></form></section><section><h2>Estado y límites</h2><p class="muted" id="notes"></p></section></div><p id="status" role="status"></p></main><script>
(()=>{'use strict';const $=x=>document.getElementById(x);const mode=location.pathname.includes('mall-manager')?'mall':location.pathname.includes('merchant')?'merchant':'control';const labels={control:'RetailNav Control',mall:'RetailNav Mall Manager',merchant:'RetailNav Merchant'};document.title=labels[mode];$('title').textContent=labels[mode];const api=new URL('../admin-api/',location.href).pathname;let csrf='',me=null;
async function call(path,method='GET',data){const headers={};if(method!=='GET'){headers['Content-Type']='application/json';headers['X-Retailnav-Csrf']=csrf}const r=await fetch(api+path,{method,credentials:'same-origin',headers,body:data===undefined?undefined:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'Error '+r.status);return j}
function message(s,bad=false){$('status').textContent=s;$('status').style.color=bad?'#ff9c9c':'#a3f5c3'}
function visible(role){return me.roles.some(r=>r.role==='platform_owner'||r.role===role)}
function row(name,status,url){const tr=document.createElement('tr');for(const v of [name,status]){const td=document.createElement('td');td.textContent=String(v||'—');tr.append(td)}const td=document.createElement('td');if(url){const a=document.createElement('a');a.href=url;a.textContent='Abrir';td.append(a)}tr.append(td);$('rows').append(tr)}
async function load(){const t=await call('v1/auth/me');csrf=t.csrf;me=t.user;$('auth').classList.add('hidden');$('private').classList.remove('hidden');$('identity').textContent=me.email;$('heading').textContent=labels[mode];$('rows').replaceChildren();if(mode==='control'){if(!visible('platform_admin')){$('intro').textContent='Sin permisos globales.';return}const [tenants,malls]=await Promise.all([call('v1/tenants'),call('v1/malls')]);$('intro').textContent='Tenants: '+tenants.items.length+' · Shoppings accesibles: '+malls.items.length;for(const t of tenants.items)row(t.name,t.status,'');for(const m of malls.items)row(m.name,m.status,'../map-studio/?mall='+encodeURIComponent(m.id));$('createTenant').classList.remove('hidden');$('notes').textContent='Facturación, contratos e invitaciones requieren integraciones y controles adicionales; no se simulan transacciones.'}
else if(mode==='mall'){const d=await call('v1/malls');$('intro').textContent='Shoppings asignados: '+d.items.length;for(const m of d.items)row(m.name,m.status,'../map-studio/?mall='+encodeURIComponent(m.id));$('notes').textContent='La edición de geometría se realiza en Map Studio con revisión independiente. Directorio y marketing se habilitarán tras completar sus contratos de datos.'}
else{$('intro').textContent='Panel de comercio en preparación: la cuenta está autenticada.';$('notes').textContent='No se permitirá cambiar locales ni promociones hasta implementar autorización por sucursal, reclamación verificada y aprobación editorial. No se muestran datos ajenos.';$('content').classList.add('hidden')}}
$('login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const d=await call('v1/auth/login','POST',Object.fromEntries(f));csrf=d.csrf;await load()}catch(e){message(e.message,true)}};$('reload').onclick=()=>load().catch(e=>message(e.message,true));$('logout').onclick=async()=>{try{await call('v1/auth/logout','POST',{});location.reload()}catch(e){message(e.message,true)}};$('tenantForm').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);await call('v1/tenants','POST',{name:f.get('name')});await load();message('Organización creada')}catch(e){message(e.message,true)}};load().catch(()=>{});
})();
</script></body></html>
